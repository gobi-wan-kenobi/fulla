# SPDX-License-Identifier: GPL-3.0-or-later
# Generate Fulla.xcodeproj with: xcodegen generate (run in ios/)
name: Fulla
options:
  bundleIdPrefix: io.github.gobiwankenobi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  FullaCore:
    path: FullaCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Fulla:
    type: application
    platform: iOS
    sources:
      - Fulla/Sources
      - Fulla/Resources
    dependencies:
      - package: FullaCore
    info:
      path: Fulla/Info.plist
      properties:
        CFBundleDisplayName: Fulla
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.gobiwankenobi.fulla
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
schemes:
  Fulla:
    build:
      targets:
        Fulla: all
